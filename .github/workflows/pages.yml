name: pages

# Publishes the ten volumes as a website on GitHub Pages.
#
# Every volume's HTML build is already one self-contained file, so the site is
# just that file per volume plus a landing page listing the series in order —
# no Jekyll, no second copy of the content, and nothing generated in git. Only
# the HTML is built here: the PDF and EPUB editions stay on the releases page,
# where they are downloads rather than reading material.
#
# One-time repository setting: Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install site dependencies
        run: python -m pip install --upgrade pip pyyaml
      - name: Build the HTML of every volume
        run: |
          set -euo pipefail
          for volume in books/*/; do
            echo "==> ${volume%/}"
            ( cd "$volume" && bash build.sh html )
          done
      - name: Assemble the site
        run: python tools/make_site.py --out site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: deploy to GitHub Pages
    needs: build
    # A manual run from a topic branch builds the site but must not publish it.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
