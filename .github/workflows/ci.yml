name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: structural checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install checker dependencies
        run: python -m pip install --upgrade pip pyyaml
      - name: Check anchors, links, part dividers and metadata
        run: python tools/check.py

  build:
    name: build ${{ matrix.volume }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        volume:
          - 01-docker
          - 02-kubernetes
          - 03-github-actions
          - 04-ansible
          - 05-terraform
          - 06-prometheus-grafana
          - 07-elastic-stack
          - 08-aws
          - 09-azure-gcp
          - 10-devsecops
    steps:
      - uses: actions/checkout@v4
      - name: Install build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc \
            fonts-dejavu-core fonts-crosextra-carlito fonts-croscore fonts-liberation \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b
          python3 -m pip install --upgrade pip
          python3 -m pip install weasyprint pillow
      - name: Report toolchain versions
        run: |
          pandoc --version | head -1
          python3 -c "import weasyprint; print('weasyprint', weasyprint.__version__)"
      - name: Build HTML, EPUB and PDF
        working-directory: books/${{ matrix.volume }}
        run: bash build.sh all
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.volume }}
          path: books/${{ matrix.volume }}/output/
          if-no-files-found: error
          retention-days: 14
